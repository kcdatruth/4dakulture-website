name: 4DK Free NBA Season Averages

on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh and validate player averages
        run: python scripts/refresh_free_nba_stats.py

      - name: Commit verified dataset only
        run: |
          if ! git diff --quiet -- data/4dk-player-stats-2026-27.json; then
            git config user.name "4DK Stats Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/4dk-player-stats-2026-27.json
            git commit -m "Refresh verified 4DK NBA player averages"
            git push
          fi
