name: 4DK Free NBA Season Averages

on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'
    - cron: '35 7 * * *'

permissions:
  contents: write

concurrency:
  group: 4dk-nba-season-averages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install statistics dependencies
        run: pip install pandas pyarrow requests

      - name: Refresh and validate NBA averages
        run: python scripts/refresh_sdv_nba_stats.py --publish

      - name: Commit verified dataset only
        run: |
          if ! git diff --quiet -- data/4dk-player-stats-2026-27.json; then
            git config user.name "4DK Stats Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/4dk-player-stats-2026-27.json
            git commit -m "Refresh verified 4DK NBA player averages"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Main advanced; rebasing verified stats (attempt $attempt)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((attempt * 2))
            done
            echo "::error::NBA stats publish failed after five attempts"
            exit 1
          fi