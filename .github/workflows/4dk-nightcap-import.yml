name: 4DK Nightcap ZIP Import
on:
  push:
    branches: [main]
    paths:
      - 'inbox/nightcap-update.zip'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: 4dk-nightcap-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated safety tests
        run: python3 scripts/test_nightcap_import.py
      - name: Import new Nightcap without overwriting archives
        run: python3 scripts/import_nightcap_zip.py
      - name: Remove processed upload from proposed change
        run: git rm --ignore-unmatch inbox/nightcap-update.zip
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/next-nightcap
          delete-branch: true
          title: '4DK: Review next NBA Nightcap'
          commit-message: '4DK: Prepare next NBA Nightcap and archive'
          body: |
            Automatically prepared from the uploaded ZIP. Verify final scores,
            full 4DK analysis, photos, archive and homepage before merging.
            No existing Nightcap edition is overwritten.
