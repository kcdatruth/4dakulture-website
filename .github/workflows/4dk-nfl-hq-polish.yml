name: 4DK NFL Weekly HQ editorial polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/4dk-nfl-hq-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish cards and editorial dates
        shell: python
        run: |
          from pathlib import Path
          p=Path('nfl-weekly-hq.html')
          s=p.read_text(encoding='utf-8')
          if 'id="fourdk-dynamic-weekly-hq"' not in s:
              raise SystemExit('Expected dynamic HQ page missing')
          if 'id="fourdk-hq-editorial-style"' not in s:
              css='''<style id="fourdk-hq-editorial-style">
          .card{position:relative;border-left:4px solid #caa35e;transition:border-color .2s}
          .card:hover,.card:focus-visible{border-color:#e2b971}
          .card small{font-size:12px;line-height:1.5;text-transform:uppercase}
          .card h3{font-size:clamp(20px,3vw,26px);line-height:1.2;margin:0 0 16px}
          .card p{margin:0;color:#d2c2a9;font-size:15px}
          .card .card-teaser{margin:12px 0 16px;color:#e9dfd0;font:16px/1.5 Georgia,serif}
          .card[data-type="SNF"],.card[data-type="TNF"]{border-left-color:#b13d36}
          .week-links a{background:#121010}
          @media(max-width:600px){.card h3{font-size:21px}}
          </style>'''
              s=s.replace('</head>',css+'</head>',1)
          if 'const editorialDate=' not in s:
              helper='''  const editorialDate=value=>{
            if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(value||''))return value||'';
            const [y,m,d]=value.split('-').map(Number);
            return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).toUpperCase();
          };
          const teasers={
            PREVIEW:'The matchups, pressure points and storylines shaping the week.',
            TNF:'The Thursday night result and what it means for the rest of the NFL week.',
            SUNDAY:'The defining Sunday performances, turning points and fallout.',
            SNF:'A primetime spotlight on the matchup and its defining plays.',
            MNF:'The Monday night finish and its impact on the league landscape.'
          };
          '''
              needle='  const safeUrl=u=>'
              if needle not in s: raise SystemExit('Renderer insertion point missing')
              s=s.replace(needle,helper+needle,1)
          s=s.replace("link.className=archiveMode?'':'card';","link.className=archiveMode?'':'card';link.dataset.type=a.type;",1)
          old="const p=document.createElement('p');p.textContent=a.date||'Read the complete 4DK coverage';"
          new="const teaser=document.createElement('div');teaser.className='card-teaser';teaser.textContent=a.summary||teasers[a.type]||'Read the complete 4DK coverage';\n                const p=document.createElement('p');p.textContent=editorialDate(a.date);"
          if old in s: s=s.replace(old,new,1)
          elif 'const teaser=document.createElement' not in s: raise SystemExit('Date renderer not found')
          s=s.replace('link.append(small,h,p);','link.append(small,h,teaser,p);',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changed page
        run: |
          git config user.name '4DK Publishing Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl-weekly-hq.html
          if ! git diff --cached --quiet; then
            git commit -m 'Polish NFL Weekly HQ cards and editorial dates'
            git push
          else
            echo 'Already polished'
          fi
