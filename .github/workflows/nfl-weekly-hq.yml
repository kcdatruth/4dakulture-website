name: 4DK NFL Weekly HQ Auto Index
on:
  push:
    branches: [main]
    paths:
      - 'nfl-*.html'
      - 'scripts/update_nfl_weekly_index.py'
      - 'scripts/test_nfl_weekly_index.py'
      - '.github/workflows/nfl-weekly-hq.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-weekly-hq-index
  cancel-in-progress: false
jobs:
  update-weekly-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify new-week rotation, archive preservation, and safe repeat runs
        run: python scripts/test_nfl_weekly_index.py
      - name: Discover newly published NFL recaps and refresh weekly archive
        run: python scripts/update_nfl_weekly_index.py
      - name: Commit index only when changed
        run: |
          if git diff --quiet -- nfl-weekly-index.json; then
            echo "NFL weekly index already up to date."
            exit 0
          fi
          git config user.name "4DK Publishing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-weekly-index.json
          git commit -m "Auto-index published NFL recaps and rotate Weekly HQ"
          git push
