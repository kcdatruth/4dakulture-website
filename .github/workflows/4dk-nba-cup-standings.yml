name: 4DK Verified NBA Cup Standings
on:
  pull_request:
    paths:
      - 'scripts/*nba_cup*.py'
      - '4dk-nba-cup.js'
      - '4dk-standings-live.js'
      - 'data/4dk-nba-cup-2026.json'
      - '.github/workflows/4dk-nba-cup-standings.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 8,14,20 * 10-11 *'
permissions:
  contents: write
concurrency:
  group: 4dk-nba-cup
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test schedule validation and failure preservation
        run: python -m unittest discover -s scripts -p 'test_nba_cup.py'
      - name: Verify completed NBA Cup games
        run: python scripts/refresh_nba_cup.py
      - name: Audit all 60 fixtures and six groups against official NBA schedule
        run: python scripts/validate_nba_cup.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-nba-cup-standings
          path: data/4dk-nba-cup-2026.json
      - name: Commit verified standings only
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/4dk-nba-cup-2026.json && [ -f data/4dk-nba-cup-2026.json ]; then
            echo "No NBA Cup standings changes"
            exit 0
          fi
          git config user.name "4DK Stats Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/4dk-nba-cup-2026.json
          git diff --cached --quiet || (git commit -m "Update verified NBA Cup group standings" && git push)
